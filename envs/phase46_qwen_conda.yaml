# Phase46: conservative glibc-2.17-oriented offline Qwen3 Doctor stack.
# Entire environment is created at /scratch/ylong66/conda/envs/pks_qwen46.
# Old Phase23-45 ms127 is deliberately NOT changed.
#
# pytorch 2.5.1 CUDA 12.1 is an officially published conda combination.
# transformers >=4.51 is required for the model_type=qwen3 architecture.
# safetensors 0.5.3 is installed from conda, not a pip Rust wheel.
name: pks_qwen46
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - transformers=4.51.3
  - accelerate=1.7.0
  - safetensors=0.5.3
  - tokenizers=0.21.1
  - huggingface_hub=0.30.2
  - numpy=1.26.4
  - packaging
  - pyyaml
  - sentencepiece
