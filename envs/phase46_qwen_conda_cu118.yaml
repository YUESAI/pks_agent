# Phase46 CUDA 11.8 Conda-first stack for Dusky glibc 2.17.
# NO pip install, no system CUDA installation, keep ms127 and cu121 unchanged.
# NVIDIA packages are taken from the immutable CUDA 11.8 label,
# especially libcurand=10.3.0.86 (avoid newer main-channel libcurand).
name: pks_qwen46_cu118
channels:
  - pytorch
  - nvidia/label/cuda-11.8.0
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pytorch=2.5.1
  - pytorch-cuda=11.8
  - libcurand=10.3.0.86
  - transformers=4.51.3
  - accelerate=1.7.0
  - safetensors=0.5.3
  - tokenizers=0.21.1
  - huggingface_hub=0.30.2
  - numpy=1.26.4
  - packaging
  - pyyaml
  - sentencepiece
